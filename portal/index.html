<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eldo Carmo Empreendimentos — Portal oficial. Barber Shop, Glamorize Beauty e Chocolate Scookiie em Luanda, Angola.">
  <title>Eldo Carmo Empreendimentos</title>
  
  <!-- Preload critical assets -->
  <link rel="preload" href="assets/images/split-hero.webp" as="image">
  <link rel="preload" href="assets/images/chocolatescookiie.webp" as="image">
  
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="assets/images/eldocarmologo.webp" type="image/webp">
</head>
<body>
  <div class="portal">
    <!-- Left side - Glamorize -->
    <a href="https://eldocarmoglamorize.pages.dev" class="side side--glamorize" id="glamorize-side">
      <div class="side__overlay"></div>
      <div class="side__content">
        <span class="side__brand side__brand--glamorize">GLAMORIZE</span>
        <span class="side__label">Beleza & Estética</span>
        <span class="side__cta">Entrar</span>
      </div>
    </a>

    <!-- Center — Chocolate Scookiie (links to future store) -->
    <a href="https://chocolatescookiie.pages.dev" class="portal__center" id="scookiie-link" aria-label="Chocolate Scookiie — Loja online" title="Chocolate Scookiie">
      <img src="assets/images/chocolatescookiie.webp" alt="Chocolate Scookiie" class="portal__logo">
      <p class="portal__tagline">Chocolate Scookiie</p>
    </a>

    <!-- Right side - Barbershop -->
    <a href="https://eldocarmobarbershop.pages.dev" class="side side--barbershop" id="barbershop-side">
      <div class="side__overlay"></div>
      <div class="side__content">
        <span class="side__brand">ELDO CARMO</span>
        <span class="side__label">Barber Shop</span>
        <span class="side__cta">Entrar</span>
      </div>
    </a>
  </div>

  <!-- Mobile fallback navigation -->
  <nav class="mobile-nav" aria-label="Navegação móvel">
    <a href="https://eldocarmoglamorize.pages.dev" class="mobile-nav__link mobile-nav__link--glamorize">
      Glamorize
      <span>Beleza & Estética</span>
    </a>
    <a href="https://chocolatescookiie.pages.dev" class="mobile-nav__link mobile-nav__link--scookiie" id="scookiie-mobile">
      Scookiie
      <span>Chocolate</span>
    </a>
    <a href="https://eldocarmobarbershop.pages.dev" class="mobile-nav__link mobile-nav__link--barbershop">
      Eldo Carmo
      <span>Barber Shop</span>
    </a>
  </nav>

  <script src="js/main.js"></script>
</body>
</html>
